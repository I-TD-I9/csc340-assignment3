<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add a Character</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar bg-dark navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Mythic Atlas</a>
        <div class="navbar-nav flex-row gap-3">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="details.html">Details</a>
          <a class="nav-link" href="about.html">About</a>
          <a class="nav-link active" href="new-character-form.html">Add a Character</a>
        </div>
      </div>
    </nav>

    <header class="py-4 border-bottom">
      <div class="container">
        <h1 class="display-6 fw-bold">Create a New Character</h1>
      </div>
    </header>

    <main class="py-5">
      <div class="container">
        <form class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="charName">Character Name</label>
            <input class="form-control" id="charName" type="text" placeholder="e.g., Heracles">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="charUniverse">Universe</label>
            <input class="form-control" id="charUniverse" type="text" placeholder="e.g., Greek Myth">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="charRole">Role</label>
            <input class="form-control" id="charRole" type="text" placeholder="e.g., Demigod Hero">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="charImage">Image URL</label>
            <input class="form-control" id="charImage" type="url" placeholder="https://">
          </div>
          <div class="col-12">
            <label class="form-label" for="charDescription">Short Description</label>
            <textarea class="form-control" id="charDescription" rows="4" placeholder="Write a short summary of the character."></textarea>
          </div>
          <div class="col-12">
            <button class="btn btn-primary" type="button">Add to Gallery</button>
          </div>
        </form>
      </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
